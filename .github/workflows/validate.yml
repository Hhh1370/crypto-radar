name: Validate Crypto Radar
on:
  push:
    branches: [main, "upgrade/**"]
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check browser and Worker JavaScript syntax
        run: |
          node --check cloudflare/worker.js
          node --check docs/radar.js
          node --check docs/pro-radar.js
          node --check docs/app.js
          node --check docs/coin-search.js
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run technical engine tests
        run: python -m unittest discover -s tests -v
