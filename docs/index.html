<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#6366f1">
  <title>رادار کریپتو</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="رادار">

  <link rel="stylesheet" href="./style.css">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>🎯 رادار کریپتو</h1>
      <p class="subtitle">تحلیل تکنیکال + بنیادی + اخبار</p>
    </div>
    <button id="refresh-btn" onclick="loadData()">🔄 بروزرسانی</button>
  </header>

  <section class="settings-panel"><details><summary>⚙️ تنظیم اتصال رایگان Cloudflare</summary><form id="api-settings"><label for="api-base">آدرس Worker (پس از Deploy از Cloudflare کپی کن)</label><input id="api-base" type="url" inputmode="url" placeholder="https://crypto-radar-public-data.username.workers.dev" autocomplete="url"><button type="submit">ذخیره و آزمایش اتصال</button><p id="api-status" class="hint">آدرس فقط در همین مرورگر ذخیره می‌شود؛ کلید API لازم نیست.</p></form></details></section>
  <main id="main">
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>در حال تحلیل بازار...</p>
      <p class="hint">بار اول ۳۰-۶۰ ثانیه طول می‌کشه</p>
    </div>
    <div id="cards" class="cards"></div>
    <div id="error" class="error hidden"></div>
  </main>

  <footer>
    <p>⚠️ این ابزار جنبه آموزشی دارد و توصیه مالی نیست</p>
  </footer>

  <script src="./indicators.js"></script>
  <script src="./radar.js"></script>
  <script src="./pro-radar.js"></script>
  <script src="./app.js"></script>
</body>
</html>
